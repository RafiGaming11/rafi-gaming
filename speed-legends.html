<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speed Legends - Rafi Gaming</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #07070b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* =========================
           HEADER
        ========================= */

        .game-header {
            position: relative;
            padding: 25px 80px 25px 25px;
            border-bottom: 1px solid #29202f;
        }

        .game-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .game-header span {
            color: #8b3dff;
        }

        .game-header p {
            font-size: 18px;
            margin-bottom: 5px;
        }

        /* =========================
           EXIT BUTTON
        ========================= */

        .exit-game {
            position: absolute;
            top: 25px;
            right: 25px;

            display: inline-block;

            padding: 10px 18px;

            background: #8b3dff;
            color: white !important;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;

            border-radius: 8px;

            border: 1px solid #b78aff;

            box-shadow: 0 0 12px rgba(139, 61, 255, 0.4);

            transition: 0.2s ease;

            z-index: 9999;
        }

        .exit-game:hover {
            background: #6f20e8;
            transform: scale(1.05);
        }

        /* =========================
           GAME AREA
        ========================= */

        .game-area {
            width: 900px;
            max-width: 95%;

            height: 600px;

            margin: 35px auto;

            position: relative;

            overflow: hidden;

            border: 2px solid #7d35ff;
            border-radius: 18px;

            background: #222;
        }

        /* =========================
           ROAD
        ========================= */

        .road {
            position: absolute;

            left: 20%;
            width: 60%;

            height: 100%;

            background: #333;

            border-left: 8px solid #eee;
            border-right: 8px solid #eee;
        }

        /* =========================
           ROAD LINE
        ========================= */

        .road-line {
            position: absolute;

            left: 50%;

            width: 10px;
            height: 100px;

            background: white;

            transform: translateX(-50%);

            animation: roadMove 0.6s linear infinite;
        }

        @keyframes roadMove {

            from {
                top: -100px;
            }

            to {
                top: 600px;
            }

        }

        /* =========================
           PLAYER CAR
        ========================= */

        .car {
            position: absolute;

            width: 65px;
            height: 110px;

            background: #ff3131;

            border-radius: 15px;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.5);
        }

        .car::before {
            content: "";

            position: absolute;

            width: 45px;
            height: 35px;

            background: #111;

            top: 12px;
            left: 10px;

            border-radius: 8px;
        }

        /* =========================
           ENEMY CAR
        ========================= */

        .enemy {
            position: absolute;

            width: 65px;
            height: 110px;

            background: #168cff;

            border-radius: 15px;

            top: -120px;
        }

        .enemy::before {
            content: "";

            position: absolute;

            width: 45px;
            height: 35px;

            background: #111;

            top: 12px;
            left: 10px;

            border-radius: 8px;
        }

        /* =========================
           SCORE
        ========================= */

        .score {
            position: absolute;

            top: 15px;
            left: 15px;

            background: rgba(0, 0, 0, 0.7);

            padding: 12px 18px;

            border-radius: 10px;

            font-size: 20px;

            z-index: 10;
        }

        /* =========================
           START SCREEN
        ========================= */

        .start-screen,
        .game-over {

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.88);

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            z-index: 40;
        }

        .start-screen h2,
        .game-over h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .start-screen p,
        .game-over p {
            font-size: 18px;
        }

        /* =========================
           GAME OVER
        ========================= */

        .game-over {
            display: none;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {

            background: #813cff;

            color: white;

            border: none;

            padding: 14px 30px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 15px;

            transition: 0.2s ease;
        }

        button:hover {
            background: #9b63ff;
            transform: scale(1.03);
        }

        /* =========================
           BACK TO GAMES
        ========================= */

        .back-games {

            display: inline-block;

            margin-top: 12px;

            padding: 10px 20px;

            color: white;

            border: 1px solid #813cff;

            border-radius: 8px;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: 0.2s ease;
        }

        .back-games:hover {
            background: #813cff;
        }

        /* =========================
           INSTRUCTIONS
        ========================= */

        .instructions {
            color: #aaa;
            margin-top: 10px;
            font-size: 16px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .game-header {
                padding: 75px 15px 20px;
            }

            .game-header h1 {
                font-size: 27px;
            }

            .game-header p {
                font-size: 15px;
            }

            .exit-game {
                top: 15px;
                right: 15px;

                padding: 9px 13px;

                font-size: 13px;
            }

            .game-area {
                height: 500px;
                margin-top: 25px;
            }

            .road {
                left: 10%;
                width: 80%;
            }

            .score {
                font-size: 15px;
                padding: 9px 12px;
            }

            .car,
            .enemy {
                width: 55px;
                height: 95px;
            }

            .car::before,
            .enemy::before {
                width: 37px;
                height: 30px;

                left: 9px;
            }

            .instructions {
                font-size: 14px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="game-header">

        <!-- EXIT BUTTON -->
        <a href="games.html" class="exit-game">
            ← EXIT GAME
        </a>

        <h1>
            SPEED <span>LEGENDS</span>
        </h1>

        <p>
            🏎️ Dodge the traffic and survive as long as possible!
        </p>

    </div>


    <!-- =========================
         GAME AREA
    ========================= -->

    <div class="game-area">


        <!-- ROAD -->

        <div class="road"></div>


        <!-- ROAD LINE -->

        <div class="road-line"></div>


        <!-- SCORE -->

        <div class="score">

            ⭐ Score:
            <span id="score">0</span>

        </div>


        <!-- PLAYER -->

        <div
            class="car"
            id="car">
        </div>


        <!-- ENEMY -->

        <div
            class="enemy"
            id="enemy">
        </div>


        <!-- =========================
             START SCREEN
        ========================= -->

        <div
            class="start-screen"
            id="startScreen">

            <h2>
                🏁 SPEED LEGENDS
            </h2>

            <p>
                Use ← → or A / D to move
            </p>

            <button onclick="startGame()">
                START GAME
            </button>

        </div>


        <!-- =========================
             GAME OVER
        ========================= -->

        <div
            class="game-over"
            id="gameOver">

            <h2>
                💥 GAME OVER
            </h2>

            <p>
                Your Score:
                <span id="finalScore">0</span>
            </p>

            <button onclick="startGame()">
                PLAY AGAIN
            </button>

            <a
                href="games.html"
                class="back-games">

                ← BACK TO GAMES

            </a>

        </div>


    </div>


    <!-- INSTRUCTIONS -->

    <p class="instructions">
        Keyboard:
        ← →
        or
        A / D
    </p>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           ELEMENTS
        ========================= */

        const car =
            document.getElementById("car");

        const enemy =
            document.getElementById("enemy");

        const scoreText =
            document.getElementById("score");

        const finalScore =
            document.getElementById("finalScore");

        const startScreen =
            document.getElementById("startScreen");

        const gameOver =
            document.getElementById("gameOver");


        /* =========================
           VARIABLES
        ========================= */

        let carX;

        let enemyY;

        let enemyX;

        let score = 0;

        let gameRunning = false;

        let speed = 5;


        /* =========================
           START GAME
        ========================= */

        function startGame() {

            gameRunning = true;

            score = 0;

            speed = 5;

            scoreText.textContent = score;

            startScreen.style.display = "none";

            gameOver.style.display = "none";

            carX = 50;

            car.style.left =
                carX + "%";

            resetEnemy();

            requestAnimationFrame(gameLoop);

        }


        /* =========================
           RESET ENEMY
        ========================= */

        function resetEnemy() {

            enemyY = -120;

            enemyX =
                25 + Math.random() * 50;

            enemy.style.left =
                enemyX + "%";

            enemy.style.top =
                enemyY + "px";

        }


        /* =========================
           GAME LOOP
        ========================= */

        function gameLoop() {

            if (!gameRunning) {
                return;
            }

            enemyY += speed;

            enemy.style.top =
                enemyY + "px";


            /* SCORE */

            if (enemyY > 600) {

                score++;

                scoreText.textContent =
                    score;

                speed += 0.15;

                resetEnemy();

            }


            checkCollision();

            requestAnimationFrame(gameLoop);

        }


        /* =========================
           COLLISION
        ========================= */

        function checkCollision() {

            const carRect =
                car.getBoundingClientRect();

            const enemyRect =
                enemy.getBoundingClientRect();


            if (

                carRect.left <
                enemyRect.right &&

                carRect.right >
                enemyRect.left &&

                carRect.top <
                enemyRect.bottom &&

                carRect.bottom >
                enemyRect.top

            ) {

                endGame();

            }

        }


        /* =========================
           GAME OVER
        ========================= */

        function endGame() {

            gameRunning = false;

            finalScore.textContent =
                score;

            gameOver.style.display =
                "flex";

        }


        /* =========================
           KEYBOARD CONTROLS
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (!gameRunning) {
                    return;
                }


                /* LEFT */

                if (

                    event.key === "ArrowLeft" ||

                    event.key.toLowerCase() === "a"

                ) {

                    carX -= 5;

                }


                /* RIGHT */

                if (

                    event.key === "ArrowRight" ||

                    event.key.toLowerCase() === "d"

                ) {

                    carX += 5;

                }


                /* LIMIT */

                if (carX < 23) {
                    carX = 23;
                }

                if (carX > 77) {
                    carX = 77;
                }


                car.style.left =
                    carX + "%";

            }
        );

    </script>


</body>

</html>
